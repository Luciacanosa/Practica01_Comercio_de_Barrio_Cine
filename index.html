<!doctype html>
<!-- cursor-none + **:cursor-none en <html>: oculta la flecha en toda la ventana, también en enlaces y botones -->
<html lang="es" class="dark scroll-smooth cursor-none **:cursor-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Lido - Tu Cine de Barrio</title>

    <!-- tipografías importadas de Adobe -->
    <link rel="stylesheet" href="https://use.typekit.net/kie0hig.css" />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Estilos con @theme según directrices Tailwind v4 -->
    <style type="text/tailwindcss">
      @theme {
      }

      /* refuerzo: ninguna parte de la página muestra la flecha del sistema */
      @layer base {
        *,
        *::before,
        *::after {
          cursor: none !important;
        }
      }
    </style>
  </head>

  <body class="min-h-screen">
    <!-- cursor personalizado: circulito rojo -->
    <div
      class="cursor-index pointer-events-none fixed top-0 left-0 z-[9999] size-5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-[#6e0000] bg-[#6e0000] transition-[scale,background-color] duration-200 ease-in-out"
    ></div>

    <!-- HEADER Y NAV -->
    <header class="">fguwebf</header>

    <main></main>

    <!-- FOOTER -->
    <footer class=""></footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
